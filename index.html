<!-- Archivo: index.html -->
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tucu Red — Infraestructura Digital & Turnero Interactivo para Comercios</title>
  <meta name="description" content="La infraestructura digital que tu comercio necesita para impulsar sus ventas. Agendá turnos 24/7, presentá catálogos interactivos y cobrá online sin comisiones." />

  <!-- Fuentes Editoriales & Iconografía Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Motor de Utilidades Tailwind + Arquitectura Modular CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BBB4N4TG4S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BBB4N4TG4S', {
      cookie_domain: 'auto'
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600/15 selection:text-indigo-700">

  <!-- Lienzo Atmosférico Aura Light -->
  <div class="aura-ambient-canvas" aria-hidden="true">
    <div class="aura-orb-violet"></div>
    <div class="aura-orb-orange"></div>
  </div>

  <!-- Puntos de Montaje Modulares (Vanilla ES6 < 200L) -->
  <div id="app-navbar" class="relative z-50"></div>

  <main class="relative z-10">
    <div id="app-hero"></div>
    <div id="app-cases"></div>
    <div id="app-showroom"></div>
    <div id="app-features"></div>
    <div id="app-funnel"></div>
  </main>

  <div id="app-footer" class="relative z-10"></div>

  <!-- Definición Estática Oculta para Detección de Netlify Forms en Build -->
  <form name="contacto-tucured" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="rubro" />
    <input type="text" name="plan" />
    <input type="text" name="nombre" />
    <input type="text" name="ciudad" />
    <input type="tel" name="whatsapp" />
  </form>

  <!-- Punto de Entrada Principal -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
