<!-- Archivo: assets/tucu_red_logo_full.svg -->
<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradArcAS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-wordmark { font-family: 'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.025em; }
      .brand-slogan { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.2em; }
    </style>
  </defs>

  <!-- Identidad Oficial con Bajada: Tipografía Conectada -->
  <text x="180" y="61" text-anchor="middle" font-size="54" class="brand-wordmark">
    <tspan class="brand-word-primary" fill="#1C1917">Tucu</tspan><tspan fill="#EA580C">Red</tspan>
  </text>
  <path d="M 179 25 C 183 9, 196 7, 203 16" fill="none" stroke="url(#gradArcAS)" stroke-width="4.4" stroke-linecap="round" />
  <circle cx="179" cy="25" r="4.2" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5" class="brand-cut-stroke" />
  <text x="180" y="85" text-anchor="middle" font-size="11.2" fill="#EA580C" class="brand-slogan">CONECTAMOS TU NEGOCIO</text>
</svg>
