<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-950 text-zinc-100 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Operativo L3 — Multi-Staff & Multi-Rubro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
    }
  </script>
  <script>(function(){const p=new URLSearchParams(window.location.search);if(p.get('embed')==='true'||window.self!==window.top)document.documentElement.classList.add('is-embedded');})();</script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .ambient-glow { background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12), transparent 65%); }
    /* Estilos Embebidos (Showcase Smartphone) */
    html.is-embedded, html.is-embedded body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; }
    html.is-embedded body { padding-bottom: 2rem !important; min-height: 100% !important; }
    html.is-embedded header { padding: 0.5rem 0.75rem !important; }
    html.is-embedded header a[href*="tucu_widgets"] { display: none !important; }
    html.is-embedded nav { padding-left: 0.5rem !important; padding-right: 0.5rem !important; gap: 0.5rem !important; }
    html.is-embedded .nav-tab { padding: 0.5rem 0.5rem !important; font-size: 11px !important; }
    html.is-embedded main { padding: 0.75rem !important; max-width: 100% !important; }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans bg-zinc-950 text-zinc-100 selection:bg-indigo-500/30 selection:text-indigo-300 ambient-glow">
  <!-- Topbar de Control Global -->
  <header class="w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <a href="/tucu_widgets.html" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800 transition-all text-xs" title="Volver al Catálogo">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </a>
      <div>
        <h1 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
          <span>⚡ Nexus Admin L3</span>
          <span id="rubro-indicator" class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-950/80 border border-indigo-500/40 text-indigo-300 font-medium">💈 Barbería</span>
        </h1>
      </div>
    </div>

    <!-- Selector de Rubro Dinámico -->
    <div class="flex items-center bg-zinc-900/90 border border-zinc-800 p-1 rounded-xl gap-1 text-xs">
      <button data-rubro="barberia" class="rubro-tab px-2.5 py-1.5 rounded-lg font-semibold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1">
        <span>💈</span><span class="hidden sm:inline">Barbería</span>
      </button>
      <button data-rubro="peluqueria_estetica" class="rubro-tab px-2.5 py-1.5 rounded-lg font-semibold transition-all text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 flex items-center gap-1">
        <span>💇‍♀️</span><span class="hidden sm:inline">Estética</span>
      </button>
      <button data-rubro="salud_consultorio" class="rubro-tab px-2.5 py-1.5 rounded-lg font-semibold transition-all text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 flex items-center gap-1">
        <span>🩺</span><span class="hidden sm:inline">Salud</span>
      </button>
      <button data-rubro="profesional_servicios" class="rubro-tab px-2.5 py-1.5 rounded-lg font-semibold transition-all text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 flex items-center gap-1">
        <span>⚖️</span><span class="hidden sm:inline">Estudio</span>
      </button>
    </div>

    <!-- Estado WhatsApp & Fecha -->
    <div class="flex items-center gap-2.5">
      <div id="wa-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-mono text-[11px]">Baileys: ONLINE</span>
      </div>
      <input type="date" id="admin-date-picker" class="bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-zinc-200 outline-none focus:border-indigo-500 cursor-pointer">
    </div>
  </header>

  <!-- Navegación por Pestañas (SPA 5 Tabs) -->
  <nav class="w-full border-b border-zinc-800/60 bg-zinc-900/40 px-4 sm:px-6 flex gap-2 sm:gap-4 overflow-x-auto hide-scrollbar">
    <button data-tab="agenda" class="nav-tab py-3 px-3 text-xs sm:text-sm font-bold border-b-2 border-indigo-500 text-indigo-400 transition-all flex items-center gap-2 flex-shrink-0">
      <span>📅</span><span>Agenda</span>
    </button>
    <button data-tab="staff" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-2 flex-shrink-0">
      <span>👥</span><span id="tab-staff-label">Personal & Horarios</span>
    </button>
    <button data-tab="services" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-2 flex-shrink-0">
      <span>✂️</span><span id="tab-services-label">Servicios & Categorías</span>
    </button>
    <button data-tab="clients" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-2 flex-shrink-0">
      <span>👤</span><span>Directorio CRM</span>
    </button>
    <button data-tab="system" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-zinc-400 hover:text-zinc-200 transition-all flex items-center gap-2 flex-shrink-0">
      <span>⚙️</span><span>Feriados & Sistema</span>
    </button>
  </nav>

  <!-- Contenedor Principal Dinámico -->
  <main class="flex-1 p-4 sm:p-6 max-w-7xl mx-auto w-full">
    <div id="admin-view-root" class="w-full space-y-6"></div>
  </main>

  <!-- Modal Container Global -->
  <div id="admin-modal-root" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden"></div>

  <!-- Scripts Modulares L3 (Suite Completa) -->
  <script src="/js/admin_l3/view_agenda.js"></script>
  <script src="/js/admin_l3/view_staff.js"></script>
  <script src="/js/admin_l3/view_services.js"></script>
  <script src="/js/admin_l3/view_clients.js"></script>
  <script src="/js/admin_l3/view_system.js"></script>
  <script src="/js/admin_l3/admin_core.js"></script>
</body>
</html>
