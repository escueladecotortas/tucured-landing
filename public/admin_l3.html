<!-- Archivo: public/admin_l3.html -->
<!DOCTYPE html>
<html lang="es" class="light h-full bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500/20">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Admin L3 — Multi-Staff & Recursos Físicos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
    }
  </script>
  <script>(function(){const p=new URLSearchParams(window.location.search);if(p.get('embed')==='true'||window.self!==window.top)document.documentElement.classList.add('is-embedded');})();</script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Estilos Embebidos (Showcase Smartphone) */
    html.is-embedded, html.is-embedded body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; }
    html.is-embedded body { padding-bottom: 2rem !important; min-height: 100% !important; }
    html.is-embedded header { padding: 0.5rem 0.75rem !important; }
    html.is-embedded header a[href*="tucu_widgets"], html.is-embedded header a[title*="Volver"] { display: none !important; }
    html.is-embedded nav { padding-left: 0.5rem !important; padding-right: 0.5rem !important; gap: 0.5rem !important; }
    html.is-embedded .nav-tab { padding: 0.5rem 0.5rem !important; font-size: 11px !important; }
    html.is-embedded main { padding: 0.75rem !important; max-width: 100% !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-24 md:pb-12 antialiased selection:bg-indigo-500/20">
  <!-- Topbar de Control Global Aura Light -->
  <header style="padding-top: max(env(safe-area-inset-top), 1rem);" class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-950/90 backdrop-blur-xl px-4 sm:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-3 min-w-0">
        <a href="/" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 transition-all text-xs" title="Volver al Inicio">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-pulse"></span>
          <h1 class="text-base font-bold text-slate-900 dark:text-slate-100 truncate flex items-center gap-1.5">
            <span>Nexus Admin L3</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-mono bg-indigo-50 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 font-bold">Aura Light</span>
          </h1>
          <span id="rubro-indicator" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-medium">💈 Barbería</span>
        </div>
      </div>

      <!-- Selector de Rubro Dinámico -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-1 rounded-2xl gap-1 text-xs">
        <button data-rubro="barberia" class="rubro-tab px-3 py-1.5 rounded-xl font-bold transition-all bg-indigo-600 text-white shadow-xs flex items-center gap-1.5">
          <span>💈</span><span class="hidden sm:inline">Barbería</span>
        </button>
        <button data-rubro="peluqueria_estetica" class="rubro-tab px-3 py-1.5 rounded-xl font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center gap-1.5">
          <span>💇‍♀️</span><span class="hidden sm:inline">Estética</span>
        </button>
        <button data-rubro="salud_consultorio" class="rubro-tab px-3 py-1.5 rounded-xl font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center gap-1.5">
          <span>🩺</span><span class="hidden sm:inline">Salud</span>
        </button>
        <button data-rubro="deportes_clubes" class="rubro-tab px-3 py-1.5 rounded-xl font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center gap-1.5">
          <span>🎾</span><span class="hidden sm:inline">Clubes</span>
        </button>
      </div>

      <!-- Telemetría Cron, WhatsApp, Fecha & Tema -->
      <div class="flex items-center gap-2 shrink-0">
        <div id="cron-telemetry-badge" onclick="AdminL3Core.switchTab('telemetry')" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 text-xs text-indigo-700 dark:text-indigo-300 font-bold cursor-pointer hover:bg-indigo-100 transition-all shadow-xs" title="Ver telemetría del Daemon Cron T-2hs">
          <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
          <span class="font-mono text-[11px]">Cron T-2hs: ACTIVO</span>
        </div>
        <div id="wa-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 shadow-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="font-mono text-[11px]">Baileys: ONLINE</span>
        </div>
        <input type="date" id="admin-date-picker" class="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 cursor-pointer shadow-xs">
        <button id="btnThemeToggle" type="button" onclick="AdminL3Core.toggleTheme()" title="Cambiar tema" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 cursor-pointer shadow-xs">
          <svg id="icon-theme-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
          <svg id="icon-theme-moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Navegación por Pestañas SPA -->
  <nav class="w-full border-b border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md px-4 sm:px-8 flex gap-1 sm:gap-3 overflow-x-auto hide-scrollbar">
    <button data-tab="agenda" class="nav-tab py-3 px-3 text-xs sm:text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>📅</span><span>Agenda Multi-Staff</span>
    </button>
    <button data-tab="staff" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>👥</span><span id="tab-staff-label">Personal Humano</span>
    </button>
    <button data-tab="resources" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>🏟️</span><span id="tab-resources-label">Recursos Físicos</span>
    </button>
    <button data-tab="services" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>✂️</span><span id="tab-services-label">Servicios</span>
    </button>
    <button data-tab="clients" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>👤</span><span>Directorio CRM</span>
    </button>
    <button data-tab="telemetry" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>⚡</span><span>Telemetría Cron T-2hs</span>
    </button>
    <button data-tab="system" class="nav-tab py-3 px-3 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-all flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
      <span>⚙️</span><span>Configuración</span>
    </button>
  </nav>

  <!-- Contenedor Principal Dinámico -->
  <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
    <div id="admin-view-root" class="w-full space-y-6"></div>
  </main>

  <!-- Modal Container Global -->
  <div id="admin-modal-root" class="fixed inset-0 z-50 bg-slate-900/60 dark:bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden"></div>

  <!-- Toast Notificaciones -->
  <div id="toast-notification" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 px-4 py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-800 shadow-xl">
    <span id="toast-icon">✓</span><span id="toast-message">Notificación</span>
  </div>

  <!-- Scripts Modulares L3 (Arquitectura Aura Light) -->
  <script src="/js/admin_l3/view_agenda.js"></script>
  <script src="/js/admin_l3/view_staff.js"></script>
  <script src="/js/admin_l3/view_resources.js"></script>
  <script src="/js/admin_l3/view_services.js"></script>
  <script src="/js/admin_l3/view_clients.js"></script>
  <script src="/js/admin_l3/view_telemetry.js"></script>
  <script src="/js/admin_l3/view_system.js"></script>
  <script src="/js/admin_l3/admin_core.js"></script>
</body>
</html>
