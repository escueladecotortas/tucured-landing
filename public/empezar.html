<!-- Archivo: public/empezar.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Crear tu App de Turnos — TucuRed</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background-color: #FAF8F5; color: #1C1917; }
    .font-serif-editorial { font-family: 'Playfair Display', Georgia, serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen bg-[#FAF8F5] text-stone-900 antialiased">
  <header class="sticky top-0 z-30 border-b border-stone-200 bg-white/95 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <a href="/" class="flex items-center gap-2 shrink-0">
        <img src="/assets/tucu_red_logo.svg" alt="TucuRed" class="w-7 h-7" />
        <span class="text-sm font-extrabold tracking-tight text-stone-900">TucuRed</span>
      </a>
      <div class="flex items-center gap-2.5 flex-1 max-w-xs mx-2">
        <span id="emp-progress-label" class="text-[11px] font-bold text-stone-600 tabular-nums shrink-0">Paso 1 de 4</span>
        <div class="flex-1 h-1.5 rounded-full bg-stone-200 overflow-hidden"><div id="emp-progress-bar" class="h-full rounded-full bg-stone-900 transition-all duration-200" style="width:25%"></div></div>
      </div>
      <a href="/" class="text-xs font-semibold text-stone-600 hover:text-stone-900 inline-flex items-center gap-1 shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span class="hidden sm:inline">Volver a la web</span><span class="sm:hidden">Web</span>
      </a>
    </div>
  </header>

  <div class="lg:hidden border-b border-stone-200 bg-white px-4 py-2.5">
    <button type="button" id="btn-open-mobile-preview" class="w-full py-2 px-3 rounded-xl bg-[#FAF8F5] border border-stone-200 text-xs font-bold text-stone-800 flex items-center justify-center gap-2 cursor-pointer">
      <svg class="w-4 h-4 text-stone-700 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      <span>Ver vista previa de tu App</span>
    </button>
  </div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-[1.15fr_0.85fr] gap-6 lg:gap-8 items-start">
      <section id="empezar-step-mount" class="bg-white border border-stone-200 rounded-3xl p-5 sm:p-7 shadow-2xs"></section>
      <aside id="empezar-live-preview" class="hidden lg:block lg:sticky lg:top-20"></aside>
    </div>
  </main>

  <div id="empezar-preview-drawer" class="hidden fixed inset-0 z-50 bg-stone-950/75 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="max-w-sm mx-auto space-y-3 py-2">
      <div class="flex items-center justify-between text-white">
        <span class="text-xs font-bold uppercase tracking-wider text-white/80">Vista previa en vivo</span>
        <button type="button" id="btn-close-mobile-preview" class="px-3 py-1.5 rounded-xl bg-white/15 border border-white/25 text-xs font-bold text-white cursor-pointer">Cerrar</button>
      </div>
      <div id="empezar-mobile-preview-mount"></div>
    </div>
  </div>

  <form name="alta-empezar-tucured" method="POST" action="/empezar-ok.html" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="alta-empezar-tucured" />
    <input type="text" name="bot-field" /><input type="text" name="name" />
    <input type="text" name="comercio" /><input type="text" name="slug" /><input type="text" name="rubro" />
    <input type="text" name="bajada" /><input type="text" name="accent" /><input type="text" name="plan" />
    <input type="text" name="localidad" /><input type="text" name="direccion" />
    <input type="text" name="direccion_lat" /><input type="text" name="direccion_lng" />
    <input type="text" name="horario_modalidad" /><input type="text" name="horario_resumen" />
    <input type="text" name="titular_nombre" /><input type="text" name="titular_apellido" />
    <input type="tel" name="whatsapp" /><input type="email" name="email" /><input type="text" name="instagram" />
    <input type="file" name="logo_file" /><input type="file" name="cover_file" />
  </form>

  <script src="/js/admin_shared/turnero_cover_data.js"></script>
  <script src="/js/activar/activar_geo.js"></script>
  <script src="/js/empezar/empezar_state.js"></script>
  <script src="/js/empezar/empezar_media.js"></script>
  <script src="/js/empezar/empezar_preview.js"></script>
  <script src="/js/empezar/empezar_steps.js"></script>
  <script src="/js/empezar/empezar_submit.js"></script>
  <script src="/js/empezar/empezar_app.js"></script>
</body>
</html>
