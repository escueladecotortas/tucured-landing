<!-- Archivo: public/assets/tucu_red_logo.svg -->
<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradArcA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-wordmark { font-family: 'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.025em; }
    </style>
  </defs>

  <!-- Identidad Oficial: Tipografía Conectada (u -> R con arco limpio y punto naranja) -->
  <text x="180" y="72" text-anchor="middle" font-size="60" class="brand-wordmark">
    <tspan class="brand-word-primary" fill="#1C1917">Tucu</tspan><tspan fill="#EA580C">Red</tspan>
  </text>
  <path d="M 179 32 C 183 14, 198 12, 205 22" fill="none" stroke="url(#gradArcA)" stroke-width="4.8" stroke-linecap="round" />
  <circle cx="179" cy="32" r="4.6" fill="#F97316" stroke="#FFFFFF" stroke-width="1.6" class="brand-cut-stroke" />
</svg>
