<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Reservar — Tucu Red</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Bricolage+Grotesque:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('tucu-embed');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'] } } } };</script>
  <link rel="stylesheet" href="/css/admin_unified.css">
  <style>
    :root {
      --tucu-primary: #B45309; --tucu-primary-hover: #92400E; --tucu-primary-text: #FFFFFF;
      --tucu-soft-bg: #FFFBEB; --tucu-soft-text: #92400E; --tucu-soft-border: #FCD34D;
      --tucu-accent: #B45309; --tucu-accent-light: #FCD34D; --tucu-panel-bg: #F1EBE3;
      --tucu-display-font: 'Instrument Serif', Georgia, serif; --tucu-display-tracking: 0em;
    }
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background-color: #FAF8F5; color: #1C1917; }
    .font-display-editorial, .font-serif-editorial { font-family: var(--tucu-display-font, 'Instrument Serif', Georgia, serif); letter-spacing: var(--tucu-display-tracking, 0em); }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .tucu-btn-primary { background-color: var(--tucu-primary); color: var(--tucu-primary-text); transition: background-color 0.18s ease, transform 0.12s ease; }
    .tucu-btn-primary:hover { background-color: var(--tucu-primary-hover); }
    .tucu-primary-text { color: var(--tucu-soft-text); }
    .tucu-soft-active { background-color: var(--tucu-soft-bg); border-color: var(--tucu-soft-border); color: var(--tucu-soft-text); }
    .tucu-slot-active { background-color: var(--tucu-primary); border-color: var(--tucu-primary); color: var(--tucu-primary-text); }
    .cover-cta-btn { background-color: var(--cover-cta-bg, var(--tucu-primary)); color: var(--cover-cta-text, #FFFFFF); }
    .cover-cta-btn:hover { background-color: var(--cover-cta-hover, var(--tucu-primary-hover)); }
    #turnero-cover-stage { transition: opacity 0.2s ease, transform 0.2s ease; }
    #turnero-cover-stage.is-leaving { opacity: 0; transform: scale(1.015); }
    html.tucu-embed, html.tucu-embed body { margin: 0; padding: 0; }
    html.tucu-embed #turnero-booking-stage main { padding: 0.5rem; }
    html.tucu-embed #turnero-steps-root { border-radius: 1rem; padding: 1rem; box-shadow: none; }
    html.tucu-embed #turnero-footer { padding-top: 0.375rem; padding-bottom: 0.5rem; }
    @media (prefers-reduced-motion: reduce) { #turnero-cover-stage { transition: none; } }
  </style>
</head>
<body class="min-h-screen bg-[#FAF8F5] text-stone-900 antialiased">
  <div id="turnero-layout" class="w-full min-h-[100dvh] lg:h-screen lg:overflow-hidden lg:grid lg:grid-cols-2">
    <aside id="turnero-cover-stage" class="w-full min-h-[100dvh] lg:block lg:h-screen lg:sticky lg:top-0 lg:overflow-hidden"></aside>

    <div id="turnero-booking-stage" style="background-color: var(--tucu-panel-bg, #F1EBE3)" class="hidden lg:flex flex-col justify-between w-full min-h-[100dvh] lg:h-screen lg:overflow-y-auto text-stone-900">
      <main class="flex-1 flex items-start lg:items-center justify-center p-3.5 sm:p-5 lg:py-4 lg:px-8">
        <div id="turnero-steps-root" class="w-full max-w-xl my-auto bg-white rounded-2xl sm:rounded-3xl border border-stone-200/80 shadow-[0_12px_40px_-15px_rgba(24,24,27,0.08)] p-4 sm:p-6">
          <section id="turnero-root" class="w-full">
            <div class="py-10 text-center text-xs text-stone-500">Cargando catálogo de servicios...</div>
          </section>
        </div>
      </main>

      <footer id="turnero-footer" class="text-center py-2.5 px-4 text-xs text-stone-600 flex items-center justify-center">
        <a id="turnero-brand-link" href="https://tucured.ar" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2.5 px-3 py-1 rounded-full hover:bg-white/60 transition-colors text-stone-600 hover:text-stone-900">
          <img id="turnero-brand-logo" src="/assets/tucu_red_logo.svg" alt="Tucu Red" class="h-5 w-auto shrink-0">
          <span id="turnero-brand-divider" class="h-3.5 w-px bg-stone-300 shrink-0" aria-hidden="true"></span>
          <span id="turnero-brand-tagline" class="font-sans text-xs font-medium tracking-wide leading-none">Conectamos tu negocio</span>
        </a>
      </footer>
    </div>
  </div>

  <script src="/js/admin_shared/admin_holidays.js"></script>
  <script src="/js/admin_shared/admin_shell.js"></script>
  <script src="/js/admin_shared/admin_contacts_parser.js"></script>
  <script src="/js/admin_shared/admin_contacts_store.js"></script>
  <script src="/js/admin_shared/admin_booking_engine.js"></script>
  <script src="/js/admin_shared/admin_wa_templates.js"></script>
  <script src="/js/admin_shared/turnero_catalog.js"></script>
  <script src="/js/admin_shared/calendar_links.js"></script>
  <script src="/js/admin_shared/ticket_modal.js"></script>
  <script src="/js/admin_shared/turnero_cover_data.js"></script>
  <script src="/js/admin_shared/turnero_cover_ui.js"></script>
  <script src="/js/admin_shared/turnero_ticket_lookup.js"></script>
  <script src="/js/admin_shared/turnero_modals_v2.js"></script>
  <script src="/js/admin_shared/turnero_steps_ui.js"></script>
  <script src="/js/admin_shared/turnero_ticket_inline.js"></script>
  <script src="/js/admin_shared/turnero_app.js"></script>
</body>
</html>
