<svg width="350" height="100" viewBox="0 0 350 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for Center Node (Goldish) -->
    <linearGradient id="gradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4956A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for Red Nodes and Lines -->
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D4C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C54B3C;stop-opacity:1" />
    </linearGradient>

    <!-- Font import (works in some viewers/browsers) -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- SYMBOL GROUP (Scaled and positioned) -->
  <!-- Original viewbox was 120x100. Let's keep it on the left. -->
  <g transform="translate(10, 0)">
      <!-- Connection Lines -->
      <g fill="none" stroke="#C54B3C" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <path d="M 22 50 Q 40 50 60 50" />
        <path d="M 98 50 Q 80 50 60 50" />
        <path d="M 29 17 Q 45 35 60 50" />
        <path d="M 91 17 Q 75 35 60 50" />
        <path d="M 60 85 Q 60 67 60 50" />
      </g>

      <!-- Nodes -->
      <circle cx="60" cy="50" r="14" fill="url(#gradCenter)" /> <!-- Center (Larger r=14 matching CSS) -->
      
      <circle cx="22" cy="50" r="10" fill="url(#gradRed)" /> <!-- Left -->
      <circle cx="98" cy="50" r="10" fill="url(#gradRed)" /> <!-- Right -->
      <circle cx="29" cy="17" r="8" fill="url(#gradRed)" /> <!-- Top-Left -->
      <circle cx="91" cy="17" r="8" fill="url(#gradRed)" /> <!-- Top-Right -->
      <circle cx="60" cy="85" r="9" fill="url(#gradRed)" /> <!-- Bottom -->
  </g>

  <!-- TEXT "TucuRed" -->
  <!-- Positioned to the right of the symbol (approx x=120) -->
  <!-- Using standard SVG text with the gradient fill -->
  <text x="130" y="65" font-size="50" fill="url(#gradRed)" font-weight="bold">TucuRed</text>
  
</svg>
